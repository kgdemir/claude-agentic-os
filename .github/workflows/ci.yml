name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    # The pack targets both Linux and macOS (bash 3.2, BSD tools).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install PyYAML for the yaml block check
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q python3-yaml
      # The scripts start with `#!/usr/bin/env bash`, so they run whichever bash
      # comes first on PATH. Put the system bash 3.2 first on macOS, as on a
      # stock Mac, and fail if any other version would run the gates.
      - name: Use the system bash 3.2
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/system-bash"
          ln -sf /bin/bash "$RUNNER_TEMP/system-bash/bash"
          echo "$RUNNER_TEMP/system-bash" >> "$GITHUB_PATH"
      - name: Check bash version
        run: |
          bash --version | head -n 1
          if [ "$RUNNER_OS" = macOS ] && [ "$(bash -c 'echo "${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}"')" != 3.2 ]; then
            echo "::error::the gates must run under bash 3.2 on macOS"
            exit 1
          fi
      - name: Gates
        run: tools/check.sh
