name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    # The pack targets both Linux and macOS (bash 3.2, BSD tools).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install PyYAML for the yaml block check
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q python3-yaml
      # The scripts and hooks find bash and python3 on PATH, where the runner
      # image may have newer builds first. Put the stock macOS ones first, as on
      # a Mac without Homebrew (bash 3.2, the system python3), and fail if any
      # other one would run the gates.
      - name: Use the system bash and python3
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/system-tools"
          ln -sf /bin/bash "$RUNNER_TEMP/system-tools/bash"
          ln -sf /usr/bin/python3 "$RUNNER_TEMP/system-tools/python3"
          echo "$RUNNER_TEMP/system-tools" >> "$GITHUB_PATH"
      - name: Check bash and python3
        run: |
          bash --version | head -n 1
          python3 --version
          if [ "$RUNNER_OS" = macOS ]; then
            if [ "$(bash -c 'echo "${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}"')" != 3.2 ]; then
              echo "::error::the gates must run under bash 3.2 on macOS"
              exit 1
            fi
            if [ "$(readlink "$(command -v python3)")" != /usr/bin/python3 ]; then
              echo "::error::the gates must run under /usr/bin/python3 on macOS"
              exit 1
            fi
          fi
      - name: Gates
        run: tools/check.sh
